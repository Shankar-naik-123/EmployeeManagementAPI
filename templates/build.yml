stages:
- stage: Build
  displayName: Build and Test the Solution
  jobs:
  - job: compile
    pool:
     name: Selfhosted Pool
    steps:
    - checkout: self
    - task: UseDotNet@2
      inputs:
       packageType: sdk
       version: 10.0.x
    - script: dotnet restore
    - script: dotnet build --configuration Release
    - script: dotnet test --no-build  --configuration Release
    - script: dotnet publish ./EmployeeManagement.API/EmployeeManagement.API.csproj -c Release -o $(Build.ArtifactStagingDirectory)
    - task: PublishBuildArtifacts@1
      inputs:
       PathtoPublish: $(Build.ArtifactStagingDirectory)
       ArtifactName: Drop

