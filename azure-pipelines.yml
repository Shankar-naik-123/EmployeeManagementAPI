#Windows agent
trigger:
  - master

variables:
  buildConfiguration: Release

stages:
  - stage: Build_And_Test_And_Deploy
    jobs:
    - job:
      pool:
       vmImage: windows-latest
      steps:
      - checkout: self
        DisplayName: "Checking out the code"
      - task: UseDotNet@2
        DisplayName: "Installing Dotnet Core sdk"
        inputs:
        packageType: sdk
        version: 10.0.x
      - script: dotnet restore
        DisplayName: "restored all packages"
      - task: DotNetCoreCli@2
        DisplayName: "Building the projects"
        inputs:
        command: 'dotnet build'
        projects: '**/*.csproj'
        arguements: 'configuration $(buildConfiguration)'
      - script: 'dotnet test --no-build'
        DisplayName: "Excecuting UnitTest cases"
      - script: dotnet publish './EmployeeManagement.API/EmployeeManagement.API.csproj' -c $(buildConfiguration) -o ($build.ArtifactStagingDirectory)
        DisplayName: "Publishing the projects"
      - task: PublishBuildArtifacts@1
        inputs:
        PathtoPublish: $(Build.ArtifactStagingDirectory)
        ArtifactName: Drop  



